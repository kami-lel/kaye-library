name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches pyproject version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} != v${version} from pyproject.toml" >&2
            exit 1
          fi

      - name: Install engine at pinned tag, kamilog, and this package
        run: |
          engine_version=$(grep -oP 'kaye-engine==\K[^"]+' pyproject.toml)
          test -n "${engine_version}"
          python -m pip install --upgrade pip
          pip install "git+https://github.com/kami-lel/kaye-engine.git@v${engine_version}"
          pip install "git+https://github.com/kami-lel/kamilog.git"
          pip install --no-deps .

      - name: Build plugin zip
        run: kaye-library build-github-release kaye-library -o dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "${GITHUB_REF_NAME}" in
            *-alpha*|*-beta*) flags="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "${GITHUB_REF_NAME}" --generate-notes ${flags}
