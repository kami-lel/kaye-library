name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: check Tag matches pyproject Version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} != v${version} from pyproject.toml" >&2
            exit 1
          fi

      - name: install Package with its pinned Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: build Release Assets
        run: kaye-library build-github-release-assets dist

      - name: build Marketplace
        run: kaye-library build-github-marketplace market

      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "${GITHUB_REF_NAME}" in
            *-alpha*|*-beta*) flags="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" --generate-notes ${flags}

      - name: check out Marketplace Repo
        if: ${{ !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') }}
        uses: actions/checkout@v4
        with:
          repository: kami-lel/kaye-library-marketplace
          ssh-key: ${{ secrets.MARKETPLACE_DEPLOY_KEY }}
          path: marketplace-repo

      - name: push Marketplace
        if: ${{ !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') }}
        run: |
          scripts/sync-marketplace-paths.sh market marketplace-repo
          cd marketplace-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .claude-plugin .agents plugins
          if git diff --cached --quiet; then
            echo "marketplace unchanged"
            exit 0
          fi
          git commit -m "release ${GITHUB_REF_NAME}"
          git tag "${GITHUB_REF_NAME}"
          git push origin HEAD:main "${GITHUB_REF_NAME}"
