[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "example-consumer"
version = "0.1.0"
description = "A minimal package built on kaye-library: its own corpus, its own values, one library skill taken over"
requires-python = ">=3.11"
dependencies = [
    "kaye-library @ git+https://github.com/kami-lel/kaye-library.git@v1.3.1",
]

[project.scripts]
example-consumer = "example_consumer.__main__:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["example_consumer*"]

[tool.setuptools.package-data]
example_consumer = ["*.md", "abbrs.json"]
