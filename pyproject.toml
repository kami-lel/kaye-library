[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "kaye-library"
version = "1.3.1"
description = "A ready-to-install library of reusable LLM instructions: shared rules for writing, git, repositories, and coding, authored once in Markdown and ready to use as skills, plugins, or plain prompts, so any agent works to the same high standard from its first prompt, powered by kaye-engine"
readme = "README.md"
authors = [
    { name = "kamiLeL", email = "77594253+kami-lel@users.noreply.github.com" },
]
requires-python = ">=3.11"
dependencies = [
    "kaye-engine @ git+https://github.com/kami-lel/kaye-engine.git@v11.1.0",
    "kamilog @ git+https://github.com/kami-lel/kamilog.git@v3.0.0",
]

[project.urls]
homepage = "https://github.com/kami-lel/kaye-library/blob/main/README.md"
Repository = "https://github.com/kami-lel/kaye-library"

[project.optional-dependencies]
dev = [
    "pydantic",
    "pytest",
    "setuptools",
    "pyyaml",
]

[project.scripts]
kaye-library = "kaye_library.__main__:main"

[tool.setuptools]
include-package-data = false
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["kaye_library*"]
exclude = ["build*", "tests*"]

[tool.setuptools.package-data]
"*" = ["registrations/**/*.md", "abbrs.json"]
